name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        id: build
        continue-on-error: true
        run: gradle build --stacktrace

      - name: Dump worldgen ore data
        if: always()
        run: |
          MC=~/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          unzip -l "$MC" | awk '{print $4}' | grep -E "worldgen/(placed_feature|configured_feature)/ore_" | sort > /tmp/files.txt
          echo "ORE_FILES_BEGIN"; cat /tmp/files.txt; echo "ORE_FILES_END"
          for f in $(cat /tmp/files.txt); do echo "### $f"; unzip -p "$MC" "$f" | tr -d '\n\t '; echo; done
          echo "### tags"
          for t in stone_ore_replaceables deepslate_ore_replaceables; do echo "# $t"; unzip -p "$MC" "data/minecraft/tags/block/$t.json" | tr -d '\n\t '; echo; done

      - name: Inspect Minecraft classes
        if: steps.build.outcome == 'failure'
        run: |
          for j in $(find ~/.gradle -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$j"; break; fi
          done
          echo "MCJAR=$MC"
          for c in net.minecraft.client.gui.Gui net.minecraft.client.Minecraft 'com.mojang.blaze3d.platform.InputConstants$Type' net.minecraft.client.gui.components.ChatComponent net.minecraft.client.KeyMapping; do
            echo "=== $c"
            javap -cp "$MC" "$c" | grep -iE "chat|overlay|screen|actionbar|message|KEYSYM|KeyMapping\(|class |static final .*Type|KEY_O|KEY_P" | head -40
          done
          echo "=== InputConstants"
          javap -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -E "KEY_O|KEY_P|Type" | head
          for c in net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player net.minecraft.world.entity.Entity net.minecraft.client.gui.Gui net.minecraft.client.Minecraft; do
            echo "=== MSG $c"
            javap -cp "$MC" "$c" | grep -iE "message|overlay|actionbar|chat|status" | head -30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: seed-ore-esp-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
