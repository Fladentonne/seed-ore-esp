name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        id: build
        continue-on-error: true
        run: gradle build --stacktrace

      - name: Dump worldgen ore data
        if: always()
        run: |
          MC=~/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          unzip -l "$MC" | awk '{print $4}' | grep -E "worldgen/(placed_feature|configured_feature)/ore_" | sort > /tmp/files.txt
          echo "ORE_FILES_BEGIN"; cat /tmp/files.txt; echo "ORE_FILES_END"
          for f in $(cat /tmp/files.txt); do echo "### $f"; unzip -p "$MC" "$f" | tr -d '\n\t '; echo; done
          echo "### tags"
          for t in stone_ore_replaceables deepslate_ore_replaceables; do echo "# $t"; unzip -p "$MC" "data/minecraft/tags/block/$t.json" | tr -d '\n\t '; echo; done

      - name: Dump ore feature configs
        if: always()
        run: |
          MC=~/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          unzip -l "$MC" | awk '{print $4}' > /tmp/all.txt
          echo "CFG_DIRS_BEGIN"; grep -E "worldgen/[a-z_]+/" /tmp/all.txt | sed -E 's#(data/minecraft/worldgen/[a-z_]+)/.*#\1#' | sort | uniq -c; echo "CFG_DIRS_END"
          echo "CFG_FILES_BEGIN"; grep -E "(coal|copper|iron|gold|diamond|lapis|redstone|debris)" /tmp/all.txt | grep -E "worldgen" | head -80; echo "CFG_FILES_END"
          for f in $(grep -E "worldgen/configured_feature/.*(coal|copper|iron|gold|diamond|lapis|redstone|debris)" /tmp/all.txt | grep -v nether_gold); do echo "### $f"; unzip -p "$MC" "$f" | tr -d '\n\t '; echo; done

      - name: Dump ore feature configs v2
        if: always()
        run: |
          MC=~/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          for n in ore_coal ore_coal_buried ore_copper_small ore_copper_large ore_iron ore_iron_small ore_gold ore_gold_buried ore_diamond_small ore_diamond_medium ore_diamond_large ore_diamond_buried ore_lapis ore_lapis_buried ore_redstone ore_ancient_debris_large ore_ancient_debris_small; do echo "CFG $n"; unzip -p "$MC" "data/minecraft/worldgen/feature/$n.json" | tr -d '\n\t '; echo; done

      - name: Dump tags and biome ore steps
        if: always()
        run: |
          MC=~/.gradle/caches/fabric-loom/26.3/minecraft-client.jar
          for t in height_specific_ore_replaceables base_stone_overworld stone_ore_replaceables deepslate_ore_replaceables; do echo "TAG $t"; unzip -p "$MC" "data/minecraft/tags/block/$t.json" | tr -d '\n\t '; echo; done
          python3 - "$MC" <<'PY'
          import sys, zipfile, json
          z = zipfile.ZipFile(sys.argv[1])
          for b in ["plains","desert","badlands","dripstone_caves","windswept_hills","jungle","stony_peaks","deep_dark","lush_caves","ocean","river","meadow","taiga","swamp"]:
              try:
                  j = json.loads(z.read(f"data/minecraft/worldgen/biome/{b}.json"))
              except KeyError:
                  print("BIOME", b, "missing"); continue
              f = j.get("features", [])
              print("BIOME", b, "steps", len(f))
              for step in (6, 7):
                  if step < len(f):
                      print("  STEP", step, [x.replace("minecraft:", "") for x in f[step]])
          PY

      - name: Inspect Minecraft classes
        if: steps.build.outcome == 'failure'
        run: |
          for j in $(find ~/.gradle -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then MC="$j"; break; fi
          done
          echo "MCJAR=$MC"
          for c in net.minecraft.client.gui.Gui net.minecraft.client.Minecraft 'com.mojang.blaze3d.platform.InputConstants$Type' net.minecraft.client.gui.components.ChatComponent net.minecraft.client.KeyMapping; do
            echo "=== $c"
            javap -cp "$MC" "$c" | grep -iE "chat|overlay|screen|actionbar|message|KEYSYM|KeyMapping\(|class |static final .*Type|KEY_O|KEY_P" | head -40
          done
          echo "=== InputConstants"
          javap -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -E "KEY_O|KEY_P|Type" | head
          for c in net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player net.minecraft.world.entity.Entity net.minecraft.client.gui.Gui net.minecraft.client.Minecraft; do
            echo "=== MSG $c"
            javap -cp "$MC" "$c" | grep -iE "message|overlay|actionbar|chat|status" | head -30
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: seed-ore-esp-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
